<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="%BASE_URL%omni-logo.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%omni-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta
      name="description"
      content="OMNI Renewal Quote Assistant — internal inspection renewal preparation tool."
    />
    <title>OMNI Renewal Quote Assistant</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('omni-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          if (theme === 'dark') document.documentElement.classList.add('dark');
        } catch (error) {
          /* theme defaults to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
